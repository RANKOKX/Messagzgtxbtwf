<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Local</title>

<style>
:root {
    --bg: #0f1416;
    --panel: #161d20;
    --text: #e7f0ee;
    --muted: #81908e;
    --accent: #2fb3a3;
    --line: #263437;
    --mine: #1f5c54;
    --other: #252d2f;
    --danger: #e18b8b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 20px 14px;
}

.app {
    width: 100%;
    max-width: 440px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 20px 0 5px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
}

.tab.active {
    background: var(--accent);
    color: #06201c;
    font-weight: bold;
}

label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin: 12px 0 5px;
}

input {
    width: 100%;
    padding: 12px;
    background: #0b1011;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    width: 100%;
    margin-top: 15px;
    background: var(--accent);
    color: #06201c;
}

.secondary {
    background: #202a2c;
    color: white;
    border: 1px solid var(--line);
}

.danger {
    background: #382224;
    color: #ffdede;
}

#error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-top: 10px;
}

.hidden {
    display: none !important;
}

#chat {
    height: 75vh;
    display: flex;
    flex-direction: column;
}

.chatHead {
    display: flex;
    align-items: center;
    padding: 10px 3px;
    gap: 6px;
}

.room {
    font-weight: bold;
}

.connection {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 15px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.msg {
    max-width: 80%;
    padding: 9px 11px;
    border-radius: 13px;
    font-size: 14px;
    word-break: break-word;
}

.msg.me {
    align-self: flex-end;
    background: var(--mine);
}

.msg.other {
    align-self: flex-start;
    background: var(--other);
}

.name {
    font-size: 11px;
    color: #9fe0d5;
    font-weight: bold;
    margin-bottom: 3px;
}

.system {
    align-self: center;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
}

.composer {
    display: flex;
    gap: 8px;
    margin-top: 9px;
}

.composer input {
    flex: 1;
}

.composer button {
    background: var(--accent);
    color: #06201c;
}

.tools {
    display: flex;
    gap: 8px;
    margin-top: 9px;
}

.tools button {
    flex: 1;
}

.note {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="app">

<h1>Chat Local</h1>

<div class="subtitle">
Chat privé avec un code à 4 chiffres
</div>

<!-- PAGE D'ACCUEIL -->

<section id="home" class="card">

    <div class="tabs">
        <div id="createTab" class="tab active">
            Créer
        </div>

        <div id="joinTab" class="tab">
            Rejoindre
        </div>
    </div>

    <label>Votre nom</label>

    <input
        id="name"
        maxlength="20"
        placeholder="Ex : Gabriel"
    >

    <label>Code du salon</label>

    <input
        id="code"
        maxlength="4"
        inputmode="numeric"
        placeholder="Ex : 4827"
    >

    <button id="mainButton" class="primary">
        Créer le salon
    </button>

    <div id="error"></div>

</section>


<!-- CHAT -->

<section id="chat" class="hidden">

    <div class="chatHead">

        <span>Salon</span>

        <span id="room" class="room"></span>

        <span id="connection" class="connection">
            ● prêt
        </span>

    </div>


    <div id="messages" class="messages">
    </div>


    <div class="composer">

        <input
            id="messageInput"
            maxlength="500"
            placeholder="Écrire un message..."
        >

        <button id="send">
            Envoyer
        </button>

    </div>


    <div class="tools">

        <button id="bluetooth" class="secondary">
            🟦 Bluetooth
        </button>

        <button id="leave" class="danger">
            Quitter
        </button>

    </div>

    <div id="bluetoothInfo" class="note"></div>

</section>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let mode = "create";

let name = "";
let roomCode = "";

let isHost = false;

let bluetoothDevice = null;
let bluetoothServer = null;


/* =========================
   ELEMENTS
========================= */

const createTab =
    document.getElementById("createTab");

const joinTab =
    document.getElementById("joinTab");

const mainButton =
    document.getElementById("mainButton");

const nameInput =
    document.getElementById("name");

const codeInput =
    document.getElementById("code");

const errorBox =
    document.getElementById("error");

const home =
    document.getElementById("home");

const chat =
    document.getElementById("chat");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const roomLabel =
    document.getElementById("room");

const connectionLabel =
    document.getElementById("connection");


/* =========================
   MODE CREATION
========================= */

createTab.onclick = function() {

    mode = "create";

    createTab.classList.add("active");
    joinTab.classList.remove("active");

    mainButton.textContent =
        "Créer le salon";

    errorBox.textContent = "";

};


/* =========================
   MODE REJOINDRE
========================= */

joinTab.onclick = function() {

    mode = "join";

    joinTab.classList.add("active");
    createTab.classList.remove("active");

    mainButton.textContent =
        "Rejoindre le salon";

    errorBox.textContent = "";

};


/* =========================
   CODE 4 CHIFFRES
========================= */

codeInput.addEventListener(
    "input",
    function() {

        this.value =
            this.value
            .replace(/\D/g, "")
            .slice(0, 4);

    }
);


/* =========================
   CODE ALÉATOIRE
========================= */

function generateCode() {

    return String(
        Math.floor(
            1000 + Math.random() * 9000
        )
    );

}


/* =========================
   MESSAGE SYSTÈME
========================= */

function systemMessage(text) {

    const element =
        document.createElement("div");

    element.className =
        "system";

    element.textContent =
        text;

    messages.appendChild(element);

    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================
   MESSAGE NORMAL
========================= */

function addMessage(
    sender,
    text,
    mine = false
) {

    const element =
        document.createElement("div");

    element.className =
        "msg " +
        (mine ? "me" : "other");


    const senderElement =
        document.createElement("div");

    senderElement.className =
        "name";

    senderElement.textContent =
        mine ? "Vous" : sender;


    const textElement =
        document.createElement("div");

    textElement.textContent =
        text;


    element.appendChild(
        senderElement
    );

    element.appendChild(
        textElement
    );


    messages.appendChild(
        element
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================
   OUVRIR LE CHAT
========================= */

function openChat() {

    home.classList.add("hidden");

    chat.classList.remove("hidden");

    roomLabel.textContent =
        roomCode;

}


/* =========================
   CRÉER
========================= */

mainButton.onclick =
function() {

    errorBox.textContent = "";

    name =
        nameInput.value.trim();


    if (!name) {

        errorBox.textContent =
            "Entre ton nom.";

        return;

    }


    if (mode === "create") {

        if (!codeInput.value) {

            roomCode =
                generateCode();

            codeInput.value =
                roomCode;

        } else {

            roomCode =
                codeInput.value;

        }

        if (!/^\d{4}$/.test(roomCode)) {

            errorBox.textContent =
                "Le code doit contenir 4 chiffres.";

            return;

        }


        isHost = true;

        openChat();

        connectionLabel.textContent =
            "● Salon créé";

        systemMessage(
            "Salon créé avec le code " +
            roomCode
        );

        systemMessage(
            "En attente de participants..."
        );

    }


    else {

        roomCode =
            codeInput.value;


        if (!/^\d{4}$/.test(roomCode)) {

            errorBox.textContent =
                "Entre un code à 4 chiffres.";

            return;

        }


        isHost = false;

        openChat();

        connectionLabel.textContent =
            "● Recherche";

        systemMessage(
            "Recherche du salon " +
            roomCode +
            "..."
        );

    }

};


/* =========================
   ENVOYER MESSAGE
========================= */

function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text)
        return;


    addMessage(
        name,
        text,
        true
    );


    /*
      Ici sera placé le transport
      Wi-Fi / Bluetooth réel.
    */


    messageInput.value = "";

}


document.getElementById("send")
    .onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


/* =========================
   BLUETOOTH
========================= */

document.getElementById("bluetooth")
.onclick = async function() {

    const info =
        document.getElementById(
            "bluetoothInfo"
        );


    if (!navigator.bluetooth) {

        info.textContent =
            "Bluetooth Web non disponible dans ce navigateur.";

        return;

    }


    try {

        info.textContent =
            "Recherche d'un appareil Bluetooth...";


        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true

            });


        info.textContent =
            "Appareil trouvé : " +
            (
                bluetoothDevice.name ||
                "Sans nom"
            );


        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            function() {

                info.textContent =
                    "Bluetooth déconnecté.";

            }
        );


    }

    catch(error) {

        info.textContent =
            "Bluetooth : " +
            error.message;

    }

};


/* =========================
   QUITTER
========================= */

document.getElementById("leave")
.onclick = function() {

    location.reload();

};

</script>

</body>
</html>
